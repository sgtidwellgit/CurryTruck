[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "currytruck"
version = "2026.11.16"
description = "Finding the best solution, one ingredient at a time — a pure Python optimization toolkit."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
keywords = [
    "optimization",
    "simulated-annealing",
    "genetic-algorithm",
    "linear-programming",
    "knapsack",
    "constraint-satisfaction",
    "pareto",
    "gradient-descent",
    "hyperparameter-search",
]

authors = [
    { name = "Babble Baz", email = "dev@babblebaz.com" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/sgtidwellgit/CurryTruck"
Changelog = "https://github.com/sgtidwellgit/CurryTruck/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "PROJECT.md",
    "ARCHITECTURE.md",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/currytruck"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
pythonpath = ["src"]
